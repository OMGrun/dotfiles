set -g default-terminal "screen-256color"

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5


bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection


unbind -T copy-mode-vi MouseDragEnd1Pane

# Style
red="#FB4934"
green="#B8BB26"
yellow="#FABD2F"
blue="#83A598"
purple="#D3869B"
aqua="#8EC07C"
orange="#FE8019"
gray="#928374"
white="#FFFFFF"
black="#000000"

set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${gray},bg=default"
set -g status-left "#[fg=${blue},bold]  #S #[fg=${gray}] "
set -g status-right "#{cpu}  #{mem}"
set -g window-status-current-format "#[fg=${green},bold] #[underscore]#I:#W"
set -g window-status-format " #I:#W"
set -g message-style "fg=${gray}, bg=default"
set -g mode-style "fg=${black}, bg=${green}"
set -g pane-border-style "fg=${gray}"
set -g pane-active-border-style "fg=${green}"


# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions every 15 minutes
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' #CPU and memory info

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Initialize TMUX plugin manager (always at the bottom!)
run '~/.tmux/plugins/tpm/tpm'
